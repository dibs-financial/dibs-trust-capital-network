name: DIBS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Compile contracts
        run: forge build
      - name: Run unit tests
        run: forge test
      - name: Run fuzz tests
        run: forge test --fuzz-runs 10000
      - name: Run invariant tests
        run: forge test --match-test invariant
      # TODO: Fork testing (requires RPC URL secret)
      # - name: Run fork tests
      #   run: forge test --fork-url ${{ secrets.MAINNET_RPC_URL }} --match-test fork
      - name: Slither security scan
        uses: crytic/slither-action@v0.3.0
        with:
          fail-on: high

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Type check
        run: cd backend && npx tsc --noEmit
      - name: Unit tests
        run: cd backend && npm test

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npx tsc --noEmit
      - name: Build
        run: cd frontend && npm run build
      - name: Unit tests
        run: cd frontend && npm test

  shared:
    name: Shared Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd shared && npm ci
      - name: Type check
        run: cd shared && npx tsc --noEmit
      - name: Unit tests
        run: cd shared && npm test
