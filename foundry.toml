[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "tests"
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 10000
max_test_rejects = 1000000

[invariant]
runs = 256
depth = 128
fail_on_revert = true

# See more config options https://book.getfoundry.sh/reference/config.html
